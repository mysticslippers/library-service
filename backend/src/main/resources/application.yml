spring:
  application:
    name: library-service-backend

  profiles:
    active: local

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  jackson:
    time-zone: UTC

  mvc:
    servlet:
      path: /api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      timeout: ${REDIS_COMMAND_TIMEOUT}
      client-name: ${REDIS_CLIENT_NAME:library-service-cache}
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    type: redis

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:database/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS_ENABLE:true}
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.ssl.enable]": ${MAIL_SMTP_SSL_ENABLE:false}
      "[mail.smtp.connectiontimeout]": ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${MAIL_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${MAIL_WRITE_TIMEOUT_MS:5000}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:library-service-backend}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": ${KAFKA_DELIVERY_TIMEOUT_MS:10000}
        "[request.timeout.ms]": ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        "[max.block.ms]": ${KAFKA_MAX_BLOCK_MS:5000}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        "[allow.auto.create.topics]": false
    listener:
      ack-mode: record
      missing-topics-fatal: false

  servlet:
    multipart:
      max-file-size: ${COVER_MAX_FILE_SIZE:5MB}
      max-request-size: ${COVER_MAX_REQUEST_SIZE:6MB}

server:
  port: ${SERVER_PORT}

logging:
  pattern:
    dateformat: "yyyy-MM-dd HH:mm:ss"

  level:
    root: INFO
    me.ifmo.backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.apache.kafka: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        library.operation: true

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  auth:
    activation-token-expiration-minutes: ${AUTH_ACTIVATION_TOKEN_EXPIRATION_MINUTES:1440}
    password-reset-token-expiration-minutes: ${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:60}

notification:
  delivery:
    max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:3}
    enabled-channels: ${NOTIFICATION_DELIVERY_ENABLED_CHANNELS:EMAIL}
    email:
      from: ${MAIL_FROM}
    sms:
      api-url: ${SMS_RU_API_URL:https://sms.ru/sms/send}
      api-id: ${SMS_RU_API_ID:}
      sender: ${SMS_RU_SENDER:}
      test-mode: ${SMS_RU_TEST_MODE:true}
      connect-timeout: ${SMS_RU_CONNECT_TIMEOUT:5s}
      read-timeout: ${SMS_RU_READ_TIMEOUT:5s}

messaging:
  kafka:
    topics:
      circulation: ${KAFKA_CIRCULATION_TOPIC:library.circulation.events}
    topic:
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
      retention-ms: ${KAFKA_TOPIC_RETENTION_MS:604800000}
    notification:
      group-id: ${KAFKA_NOTIFICATION_GROUP_ID:library-notification}
      retry-attempts: ${KAFKA_NOTIFICATION_RETRY_ATTEMPTS:4}
      retry-delay-ms: ${KAFKA_NOTIFICATION_RETRY_DELAY_MS:1000}
    outbox:
      batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:50}
      poll-interval-ms: ${KAFKA_OUTBOX_POLL_INTERVAL_MS:1000}
      publish-timeout: ${KAFKA_OUTBOX_PUBLISH_TIMEOUT:5s}
      retry-delay: ${KAFKA_OUTBOX_RETRY_DELAY:5s}

cache:
  catalog-search:
    ttl: ${CATALOG_SEARCH_CACHE_TTL:90s}
    key-prefix: ${CACHE_KEY_PREFIX:library-service-backend:local:}

storage:
  covers:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_COVERS_BUCKET:library-covers}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    create-bucket: ${S3_CREATE_BUCKET:true}
    api-call-timeout: ${S3_API_CALL_TIMEOUT:10s}
    max-file-size: ${COVER_MAX_FILE_SIZE:5MB}
