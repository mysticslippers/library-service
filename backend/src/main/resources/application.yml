spring:
  application:
    name: library-service-backend

  profiles:
    active: local

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  jackson:
    time-zone: UTC

  mvc:
    servlet:
      path: /api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT}
      timeout: ${REDIS_COMMAND_TIMEOUT}
      client-name: ${REDIS_CLIENT_NAME:library-service-cache}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cache:
    type: redis

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:database/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS_ENABLE:true}
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.ssl.enable]": ${MAIL_SMTP_SSL_ENABLE:false}
      "[mail.smtp.connectiontimeout]": ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${MAIL_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${MAIL_WRITE_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT}

logging:
  pattern:
    dateformat: "yyyy-MM-dd HH:mm:ss"

  level:
    root: INFO
    me.ifmo.backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  auth:
    activation-token-expiration-minutes: ${AUTH_ACTIVATION_TOKEN_EXPIRATION_MINUTES:1440}
    password-reset-token-expiration-minutes: ${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:60}

notification:
  delivery:
    max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:3}
    enabled-channels: ${NOTIFICATION_DELIVERY_ENABLED_CHANNELS:EMAIL}
    email:
      from: ${MAIL_FROM}
    sms:
      api-url: ${SMS_RU_API_URL:https://sms.ru/sms/send}
      api-id: ${SMS_RU_API_ID:}
      sender: ${SMS_RU_SENDER:}
      test-mode: ${SMS_RU_TEST_MODE:true}
      connect-timeout: ${SMS_RU_CONNECT_TIMEOUT:5s}
      read-timeout: ${SMS_RU_READ_TIMEOUT:5s}

cache:
  catalog-search:
    ttl: ${CATALOG_SEARCH_CACHE_TTL:90s}
    key-prefix: ${CACHE_KEY_PREFIX:library-service-backend:local:}
