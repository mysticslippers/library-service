services:
  restore-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restored
      POSTGRES_USER: restore_admin
      POSTGRES_PASSWORD: ${RESTORE_DB_PASSWORD:?Use scripts/backup.py}
    volumes:
      - /var/lib/postgresql/data
    networks: [verification]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U restore_admin -d restored"]
      interval: 2s
      timeout: 3s
      retries: 30

  restore-s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: restore-admin
      MINIO_ROOT_PASSWORD: ${RESTORE_S3_PASSWORD:?Use scripts/backup.py}
    volumes:
      - /data
    networks: [verification]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30

  verifier:
    image: library-service-backup:local
    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    environment:
      PGHOST: restore-db
      PGPORT: "5432"
      PGDATABASE: restored
      PGUSER: restore_admin
      PGPASSWORD: ${RESTORE_DB_PASSWORD:?Use scripts/backup.py}
      S3_ENDPOINT: http://restore-s3:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: restore-admin
      S3_SECRET_KEY: ${RESTORE_S3_PASSWORD:?Use scripts/backup.py}
      S3_COVERS_BUCKET: restored-covers
      BACKUP_SOURCE_ID: ${BACKUP_SOURCE_ID:?Use scripts/backup.py}
    volumes:
      - type: bind
        source: ${BACKUP_DIRECTORY:?Use scripts/backup.py}
        target: /repository
        read_only: true
      - /work
    secrets: [backup_password]
    networks: [verification]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

secrets:
  backup_password:
    file: ${BACKUP_PASSWORD_FILE:?Use scripts/backup.py}

networks:
  verification:
    internal: true
